<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog SLAM - 3D 建图导航 (Potree 引擎)</title>

<!-- Potree 核心 (CDN) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/potree@1.8.2/build/potree/potree.css">
<script src="https://cdn.jsdelivr.net/npm/potree@1.8.2/build/potree/potree.js"></script>

<!-- roslib -->
<script src="libs/roslib.min.js"></script>

<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#0a0d14; font-family:'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }

/* Potree 容器 */
#potree_container { width:100%; height:100%; position:relative; }
#potree_container .potree_container { width:100% !important; height:100% !important; }

/* ===== Status Bar ===== */
#statusbar {
  position:absolute; top:0; left:0; right:0; z-index:200;
  display:flex; align-items:center; gap:20px;
  padding:6px 16px; background:rgba(10,13,20,0.85);
  border-bottom:1px solid rgba(0,180,255,0.2);
  color:#ccd; font-size:12px; backdrop-filter:blur(6px);
  pointer-events:none;
}
#statusbar .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }
#statusbar .dot.on { background:#00e676; box-shadow:0 0 6px #00e676; }
#statusbar .dot.off { background:#ff5252; }
#statusbar .dot.warn { background:#ff9100; }
#statusbar .sep { width:1px; height:16px; background:rgba(255,255,255,0.15); }
#statusbar span { pointer-events:auto; }

/* ===== Sidebar ===== */
#sidebar {
  position:absolute; top:38px; left:8px; bottom:8px; z-index:200;
  width:290px; background:rgba(15,20,35,0.93);
  border:1px solid rgba(0,180,255,0.18); border-radius:10px;
  padding:0; display:flex; flex-direction:column;
  backdrop-filter:blur(10px); color:#cdd; font-size:13px;
  overflow:hidden;
}
#sidebar .header {
  padding:12px 14px; border-bottom:1px solid rgba(0,180,255,0.15);
  font-size:15px; font-weight:600; color:#00b4ff;
  display:flex; align-items:center; gap:8px;
}
#sidebar .scroll {
  flex:1; overflow-y:auto; padding:8px 14px;
  scrollbar-width:thin; scrollbar-color:rgba(0,180,255,0.3) transparent;
}
#sidebar .scroll::-webkit-scrollbar { width:4px; }
#sidebar .scroll::-webkit-scrollbar-thumb { background:rgba(0,180,255,0.3); border-radius:2px; }

.section { margin-bottom:12px; }
.section-title {
  font-size:11px; font-weight:700; text-transform:uppercase;
  color:#607d9b; margin-bottom:6px; letter-spacing:1px;
}
input[type="text"], select {
  width:100%; padding:6px 8px; background:#121a2b;
  color:#dde; border:1px solid rgba(0,180,255,0.2); border-radius:5px;
  font-size:12px; outline:none; transition:border 0.2s;
}
input[type="text"]:focus, select:focus { border-color:#00b4ff; }
input[type="range"] { width:100%; accent-color:#00b4ff; }

label { display:flex; align-items:center; gap:6px; margin:4px 0; font-size:12px; cursor:pointer; color:#bcc; }
label input[type="checkbox"] { accent-color:#00b4ff; width:14px; height:14px; }

.row { display:flex; gap:8px; align-items:center; }
.row > * { flex:1; }

.btn {
  padding:7px 12px; border:1px solid rgba(0,180,255,0.3); border-radius:6px;
  background:rgba(0,180,255,0.08); color:#00b4ff; cursor:pointer;
  font-size:12px; font-weight:500; transition:all 0.2s; text-align:center;
}
.btn:hover { background:rgba(0,180,255,0.18); }
.btn.primary { background:#00b4ff; color:#0a0d14; border-color:#00b4ff; }
.btn.primary:hover { background:#33c8ff; }
.btn.warn { color:#ff9100; border-color:rgba(255,145,0,0.3); }
.btn.warn:hover { background:rgba(255,145,0,0.15); }
.btn.full { width:100%; }

.status-text { font-size:11px; padding:2px 0; }
.status-text.ok { color:#00e676; }
.status-text.err { color:#ff5252; }
.status-text.info { color:#78909c; }

.slider-val { font-size:11px; color:#78909c; min-width:36px; text-align:right; }

/* ===== Camera Buttons ===== */
#camera-presets {
  position:absolute; right:12px; bottom:12px; z-index:200;
  display:flex; flex-direction:column; gap:4px;
}
.cam-btn {
  width:36px; height:36px; border-radius:50%; border:1px solid rgba(0,180,255,0.25);
  background:rgba(15,20,35,0.85); color:#90a4ae; cursor:pointer;
  font-size:16px; display:flex; align-items:center; justify-content:center;
  transition:all 0.2s; backdrop-filter:blur(4px);
}
.cam-btn:hover { background:rgba(0,180,255,0.2); color:#00b4ff; }
</style>
</head>
<body>

<div id="potree_container"></div>

<!-- Status Bar -->
<div id="statusbar">
  <span><span class="dot off" id="rosDot"></span><span id="rosStatusText">未连接</span></span>
  <span class="sep"></span>
  <span>FPS: <b id="fpsVal">0</b></span>
  <span class="sep"></span>
  <span>实时点: <b id="ptsVal">0</b></span>
  <span class="sep"></span>
  <span>机器人: <b id="poseVal">-</b></span>
</div>

<!-- Sidebar -->
<div id="sidebar">
  <div class="header">
    <span>🐕</span> Potree 3D Viewer
  </div>

  <div class="scroll">

    <!-- ROS 连接 -->
    <div class="section">
      <div class="section-title">ROS 连接</div>
      <input type="text" id="rosUrl" value="ws://10.0.4.58:9090" placeholder="ws://host:9090">
      <div class="row" style="margin-top:6px;">
        <input type="text" id="namespace" value="rkbot" placeholder="命名空间">
        <button class="btn primary" id="btnConnect" style="flex:0 0 70px;">连接</button>
      </div>
    </div>

    <!-- Potree 地图 -->
    <div class="section">
      <div class="section-title">Potree 静态地图</div>
      <input type="text" id="mapUrl" value="potree_data/3dmap/" placeholder="地图URL (如 potree_data/3dmap/)">
      <div class="row" style="margin-top:6px;">
        <input type="text" id="mapName" value="3dmap" placeholder="地图名称">
        <button class="btn" id="btnLoadMap" style="flex:0 0 70px;">加载</button>
      </div>
      <div class="status-text info" id="mapStatus">
        输入 PotreeConverter 输出的 cloud.js URL 路径
      </div>
    </div>

    <!-- 实时点云 -->
    <div class="section">
      <div class="section-title">实时点云叠加</div>
      <label><input type="checkbox" id="chkMapCloud" checked> 地图点云 (降采样)</label>
      <input type="text" id="mapCloudTopic" value="/web/map_cloud" style="margin-bottom:4px;">
      <label><input type="checkbox" id="chkBodyCloud"> 实时机体点云</label>
      <input type="text" id="bodyCloudTopic" value="/rkbot/lio/body/cloud">
    </div>

    <!-- 路径 & 轨迹 -->
    <div class="section">
      <div class="section-title">路径 & 轨迹</div>
      <label><input type="checkbox" id="chkPath" checked> 导航路径</label>
      <input type="text" id="pathTopic" value="/planned_path" style="margin-bottom:4px;">
      <label><input type="checkbox" id="chkTraj" checked> 机器人轨迹</label>
      <label><input type="checkbox" id="chkRobot" checked> 机器人模型</label>
    </div>

    <!-- 显示选项 -->
    <div class="section">
      <div class="section-title">显示选项</div>
      <div class="row">
        <span style="font-size:11px;color:#78909c;">点大小</span>
        <span class="slider-val" id="ptSizeVal">2</span>
      </div>
      <input type="range" id="pointSize" min="1" max="8" value="2" step="0.5">

      <div class="row" style="margin-top:6px;">
        <span style="font-size:11px;color:#78909c;">降采样(m)</span>
        <span class="slider-val" id="voxelVal">0.5</span>
      </div>
      <input type="range" id="voxelSize" min="0.1" max="2.0" value="0.5" step="0.05">

      <div class="row" style="margin-top:6px;">
        <span style="font-size:11px;color:#78909c;">最大实时点数</span>
        <span class="slider-val" id="maxPtsVal">200k</span>
      </div>
      <input type="range" id="maxPoints" min="10000" max="500000" value="200000" step="10000">

      <label style="margin-top:6px;"><input type="checkbox" id="chkColorHeight" checked> 按高度着色</label>
      <label><input type="checkbox" id="chkGrid" checked> 网格地面</label>
    </div>

    <!-- 操作 -->
    <div class="section">
      <button class="btn warn full" id="btnClear">清除实时数据</button>
    </div>
  </div>
</div>

<!-- 相机按钮 -->
<div id="camera-presets">
  <button class="cam-btn" title="俯视" onclick="setCameraView('top')">⬆</button>
  <button class="cam-btn" title="跟随" onclick="setCameraView('follow')">🎯</button>
  <button class="cam-btn" title="自由" onclick="setCameraView('free')">🔄</button>
</div>

<script>
// ============================================================
//  全局状态
// ============================================================
let ros = null;
let tfClient = null;
let potreeViewer = null;

// 实时叠加层 (Three.js 原生对象, 加到 Potree 的 scene 中)
let overlayGroup = null;         // 所有实时元素的根 Group
let mapCloudMesh = null;         // 降采样地图点云
let bodyCloudMesh = null;        // 机体实时点云
let pathLine = null;             // 导航路径
let trajLine = null;             // 机器人轨迹线
let trajPoints = [];
let robotModelGroup = null;

// 统计
let lastRobotPos = { x:0, y:0, z:0 };
let frameCount = 0, lastFpsTime = performance.now(), currentFps = 0;
let followMode = false;

// ============================================================
//  点云解析 & 降采样
// ============================================================
function parsePointCloud2Data(data, fields, point_step, totalPoints, is_bigendian) {
  const positions = new Float32Array(totalPoints * 3);
  let xOff=-1, yOff=-1, zOff=-1;
  for (const f of fields) {
    if (f.name==='x') xOff=f.offset;
    else if (f.name==='y') yOff=f.offset;
    else if (f.name==='z') zOff=f.offset;
  }
  if (xOff<0||yOff<0||zOff<0) return { positions:new Float32Array(0) };

  const dv = new DataView(data.buffer, data.byteOffset||0, data.byteLength);
  const le = !is_bigendian;
  let validCount = 0;
  for (let i=0; i<totalPoints; i++) {
    const off = i*point_step;
    const x=dv.getFloat32(off+xOff,le), y=dv.getFloat32(off+yOff,le), z=dv.getFloat32(off+zOff,le);
    if (isNaN(x)||isNaN(y)||isNaN(z)||!isFinite(x)||!isFinite(y)||!isFinite(z)) continue;
    const j=validCount;
    positions[j*3]=x; positions[j*3+1]=y; positions[j*3+2]=z;
    validCount++;
  }
  return {
    positions: validCount<totalPoints ? positions.subarray(0,validCount*3) : positions,
    count: validCount
  };
}

function getMsgData(msg) {
  if (!msg||!msg.data) return null;
  if (msg.data instanceof Uint8Array) return msg.data;
  if (msg.data instanceof ArrayBuffer) return new Uint8Array(msg.data);
  if (typeof msg.data==='string') {
    try {
      const raw=atob(msg.data);
      const bytes=new Uint8Array(raw.length);
      for (let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
      return bytes;
    } catch(e) { return null; }
  }
  return null;
}

function voxelDownsample(positions, resolution) {
  const map = new Map();
  const n = positions.length/3;
  for (let i=0; i<n; i++) {
    const x=positions[i*3], y=positions[i*3+1], z=positions[i*3+2];
    const ix=Math.floor(x/resolution), iy=Math.floor(y/resolution), iz=Math.floor(z/resolution);
    const key=`${ix},${iy},${iz}`;
    if (!map.has(key)) map.set(key,{x,y,z});
  }
  return map;
}

function heightColor(z, zMin, zMax) {
  if (zMax<=zMin) return {r:0,g:1,b:0};
  const t=Math.max(0,Math.min(1,(z-zMin)/(zMax-zMin)));
  if (t<0.25) return {r:0,g:t*4,b:1};
  if (t<0.5)  return {r:0,g:1,b:1-(t-0.25)*4};
  if (t<0.75) return {r:(t-0.5)*4,g:1,b:0};
  return {r:1,g:1-(t-0.75)*4,b:0};
}

function updatePointCloudMesh(mesh, voxelMap, pointSize, useHeightColor) {
  const points = Array.from(voxelMap.values());
  const numPoints = points.length;
  if (numPoints===0) { if(mesh) mesh.visible=false; return mesh; }

  const positionsArr = new Float32Array(numPoints*3);
  const colorsArr = new Float32Array(numPoints*3);

  let zMin=Infinity, zMax=-Infinity;
  if (useHeightColor) {
    for (const p of points) { if(p.z<zMin) zMin=p.z; if(p.z>zMax) zMax=p.z; }
  }
  if (zMax<=zMin) { zMin=-5; zMax=5; }

  for (let i=0; i<numPoints; i++) {
    const p=points[i];
    positionsArr[i*3]=p.x; positionsArr[i*3+1]=p.y; positionsArr[i*3+2]=p.z;
    const col = useHeightColor ? heightColor(p.z,zMin,zMax) : {r:0,g:1,b:0.53};
    colorsArr[i*3]=col.r; colorsArr[i*3+1]=col.g; colorsArr[i*3+2]=col.b;
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positionsArr,3));
  geom.setAttribute('color', new THREE.BufferAttribute(colorsArr,3));
  const mat = new THREE.PointsMaterial({
    size: pointSize*0.03, vertexColors:true, sizeAttenuation:true,
    transparent:true, opacity:0.85, depthWrite:true
  });

  if (mesh) { mesh.geometry.dispose(); mesh.material.dispose(); }
  const newMesh = new THREE.Points(geom, mat);
  newMesh.visible = true;
  return newMesh;
}

// ============================================================
//  机器人 3D 模型
// ============================================================
function createRobotModel() {
  const group = new THREE.Group();
  // 主体
  const bodyGeom = new THREE.BoxGeometry(0.6, 0.2, 0.35);
  const bodyMat = new THREE.MeshPhongMaterial({ color:0x1a8aff, emissive:0x001133, transparent:true, opacity:0.85 });
  const body = new THREE.Mesh(bodyGeom, bodyMat);
  body.position.y = 0.15;
  group.add(body);
  // 箭头
  const arrowGeom = new THREE.ConeGeometry(0.08, 0.25, 8);
  const arrowMat = new THREE.MeshPhongMaterial({ color:0xff3333, emissive:0x330000 });
  const arrow = new THREE.Mesh(arrowGeom, arrowMat);
  arrow.position.set(0.35, 0.25, 0);
  arrow.rotation.x = Math.PI/2;
  group.add(arrow);
  // 腿
  const legGeom = new THREE.CylinderGeometry(0.04,0.04,0.15,8);
  const legMat = new THREE.MeshPhongMaterial({ color:0x556677 });
  [[0.22,0.08,0.14],[0.22,0.08,-0.14],[-0.22,0.08,0.14],[-0.22,0.08,-0.14]].forEach(([lx,ly,lz]) => {
    const leg = new THREE.Mesh(legGeom, legMat);
    leg.position.set(lx,ly,lz);
    group.add(leg);
  });
  group.visible = false;
  return group;
}

// ============================================================
//  Potree 初始化
// ============================================================
function initPotree() {
  const container = document.getElementById('potree_container');

  potreeViewer = new Potree.Viewer(container);
  potreeViewer.setEDLEnabled(false);
  potreeViewer.setFOV(60);
  potreeViewer.setPointBudget(2_000_000);
  potreeViewer.setBackgroundColor([0.04, 0.05, 0.08]);

  // 关闭 Potree 自带的侧边栏
  potreeViewer.toggleSidebar();

  // 创建实时数据叠加层
  const scene = potreeViewer.scene;
  overlayGroup = new THREE.Group();
  overlayGroup.name = 'ros_overlay';
  scene.add(overlayGroup);

  // 光照
  const ambient = new THREE.AmbientLight(0x334466, 1.2);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(15, 25, 10);
  scene.add(dirLight);

  // 网格地面
  updateGrid();

  // 机器人模型
  robotModelGroup = createRobotModel();
  overlayGroup.add(robotModelGroup);

  // 尝试自动加载地图
  const mapUrl = document.getElementById('mapUrl').value.trim();
  if (mapUrl) loadPotreeMap(mapUrl, document.getElementById('mapName').value.trim());

  // 动画循环
  requestAnimationFrame(animate);
}

function animate() {
  requestAnimationFrame(animate);

  // 跟随模式
  if (followMode && robotModelGroup?.visible) {
    const pos = robotModelGroup.position;
    const cam = potreeViewer.scene.getActiveCamera();
    if (cam) {
      const controls = potreeViewer.getControls();
      if (controls) {
        controls.target.lerp(pos, 0.05);
      }
    }
  }

  potreeViewer.update();

  // FPS
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    currentFps = Math.round(frameCount/((now-lastFpsTime)/1000));
    document.getElementById('fpsVal').textContent = currentFps;
    frameCount = 0;
    lastFpsTime = now;
    document.getElementById('poseVal').textContent =
      `${lastRobotPos.x.toFixed(2)}, ${lastRobotPos.y.toFixed(2)}, ${lastRobotPos.z.toFixed(2)}`;
  }
}

// ============================================================
//  Potree 地图加载
// ============================================================
function loadPotreeMap(url, name) {
  const statusEl = document.getElementById('mapStatus');
  statusEl.textContent = '⏳ 加载中...';
  statusEl.className = 'status-text info';

  // 移除旧地图
  const oldClouds = potreeViewer.scene.pointclouds || [];
  for (const pc of [...oldClouds]) {
    potreeViewer.scene.removePointCloud(pc);
  }

  Potree.loadPointCloud(url, name || 'map', function(e) {
    const pc = e.pointcloud;
    pc.name = name || 'map';
    // 应用材质
    pc.material.size = 1;
    pc.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
    pc.material.shape = Potree.PointShape.CIRCLE;

    potreeViewer.scene.addPointCloud(pc);

    // 自适应视野
    potreeViewer.fitToScreen();

    statusEl.textContent = `✅ "${name||'map'}" 加载完成 (${pc.points.length.toLocaleString()} 点)`;
    statusEl.className = 'status-text ok';
    console.log('[Potree] 地图加载成功:', pc.points.length, '点');
  });
}

// ============================================================
//  ROS 连接
// ============================================================
function connectROS() {
  const url = document.getElementById('rosUrl').value.trim();
  if (!url) return;

  if (ros) { ros.close(); ros = null; }

  ros = new ROSLIB.Ros({ url });

  const dot = document.getElementById('rosDot');
  const txt = document.getElementById('rosStatusText');
  const btn = document.getElementById('btnConnect');

  ros.on('connection', () => {
    dot.className = 'dot on';
    txt.textContent = `已连接 ${url}`;
    btn.textContent = '断开';
    btn.classList.add('warn');
    btn.classList.remove('primary');
    initROSSubscriptions();
  });

  ros.on('close', () => {
    dot.className = 'dot off';
    txt.textContent = '已断开';
    btn.textContent = '连接';
    btn.classList.add('primary');
    btn.classList.remove('warn');
  });

  ros.on('error', (err) => {
    dot.className = 'dot off';
    txt.textContent = '连接错误';
    console.error('ROS error:', err);
  });
}

function disconnectROS() {
  if (tfClient) { tfClient.dispose(); tfClient = null; }
  unsubscribeAll();
  if (ros) { ros.close(); ros = null; }
}

// ============================================================
//  话题订阅
// ============================================================
let currentSubs = [];

function unsubscribeAll() {
  for (const sub of currentSubs) {
    try { sub.unsubscribe(); } catch(e) {}
  }
  currentSubs = [];
}

function initROSSubscriptions() {
  if (!ros?.isConnected) return;
  unsubscribeAll();

  // TF
  if (tfClient) tfClient.dispose();
  tfClient = new ROSLIB.TFClient({
    ros, angularThres: 0.05, transThres: 0.05, rate: 10.0, fixedFrame: 'map'
  });

  const ns = document.getElementById('namespace').value.trim();
  const targetFrame = ns ? `${ns}/base_footprint` : 'base_footprint';
  subscribeTF(targetFrame);

  refreshSubscriptions();
}

let lastTrajTime = 0;
function subscribeTF(targetFrame) {
  tfClient.subscribe('map', targetFrame, (tf) => {
    // 更新机器人位姿
    if (robotModelGroup) {
      robotModelGroup.visible = document.getElementById('chkRobot').checked;
      robotModelGroup.position.set(tf.translation.x, tf.translation.y, tf.translation.z);
      const q = new THREE.Quaternion(tf.rotation.x, tf.rotation.y, tf.rotation.z, tf.rotation.w);
      robotModelGroup.quaternion.copy(q);
      lastRobotPos = { x:tf.translation.x, y:tf.translation.y, z:tf.translation.z };
    }

    // 轨迹
    if (document.getElementById('chkTraj').checked) {
      const now = performance.now();
      if (now - lastTrajTime > 200) {
        lastTrajTime = now;
        trajPoints.push({ x:tf.translation.x, y:tf.translation.y, z:tf.translation.z });
        if (trajPoints.length > 10000) trajPoints = trajPoints.slice(-10000);
        updateTrajectoryLine();
      }
    }
  });
}

function refreshSubscriptions() {
  if (!ros?.isConnected) return;
  unsubscribeAll();

  // 重建 TF
  const ns = document.getElementById('namespace').value.trim();
  const targetFrame = ns ? `${ns}/base_footprint` : 'base_footprint';
  if (tfClient) tfClient.dispose();
  tfClient = new ROSLIB.TFClient({
    ros, angularThres: 0.05, transThres: 0.05, rate: 10.0, fixedFrame: 'map'
  });
  subscribeTF(targetFrame);

  const pointSize = parseFloat(document.getElementById('pointSize').value)||2;
  const voxelSize = parseFloat(document.getElementById('voxelSize').value)||0.5;
  const maxPts = parseInt(document.getElementById('maxPoints').value)||200000;
  const useHeightColor = document.getElementById('chkColorHeight').checked;

  if (document.getElementById('chkMapCloud').checked) {
    const t = document.getElementById('mapCloudTopic').value.trim();
    if (t) subscribeCloud(t, 'map', pointSize, voxelSize, maxPts, useHeightColor);
  }
  if (document.getElementById('chkBodyCloud').checked) {
    const t = document.getElementById('bodyCloudTopic').value.trim();
    if (t) subscribeCloud(t, 'body', pointSize, voxelSize, maxPts, useHeightColor);
  }
  if (document.getElementById('chkPath').checked) {
    const t = document.getElementById('pathTopic').value.trim();
    if (t) subscribePath(t);
  }
}

let lastCloudTime = {};
function subscribeCloud(topic, type, pointSize, voxelSize, maxPts, useHeightColor) {
  const topicObj = new ROSLIB.Topic({
    ros, name: topic, messageType: 'sensor_msgs/PointCloud2', throttle_rate: 200
  });

  topicObj.subscribe((msg) => {
    const now = performance.now();
    if (lastCloudTime[topic] && now-lastCloudTime[topic] < 200) return;
    lastCloudTime[topic] = now;

    const data = getMsgData(msg);
    if (!data) return;
    const totalPoints = msg.width*msg.height;
    if (totalPoints===0) return;

    const parsed = parsePointCloud2Data(data, msg.fields, msg.point_step, totalPoints, msg.is_bigendian);
    if (parsed.count===0) return;

    const voxelMap = voxelDownsample(parsed.positions, voxelSize);
    if (voxelMap.size > maxPts) {
      const entries = Array.from(voxelMap.entries());
      const toRemove = voxelMap.size - maxPts;
      for (let i=0; i<toRemove; i++) {
        const idx = Math.floor(Math.random()*entries.length);
        voxelMap.delete(entries[idx][0]);
        entries.splice(idx,1);
      }
    }

    let meshVar;
    if (type==='map') meshVar = mapCloudMesh;
    else meshVar = bodyCloudMesh;

    const newMesh = updatePointCloudMesh(meshVar, voxelMap, pointSize, useHeightColor);

    if (meshVar && meshVar!==newMesh) {
      overlayGroup.remove(meshVar);
      if (meshVar.geometry) meshVar.geometry.dispose();
      if (meshVar.material) meshVar.material.dispose();
    }
    if (newMesh && newMesh!==meshVar) overlayGroup.add(newMesh);

    if (type==='map') mapCloudMesh = newMesh;
    else bodyCloudMesh = newMesh;

    // 统计
    let totalPts = 0;
    if (mapCloudMesh?.visible) totalPts += mapCloudMesh.geometry.attributes.position.count;
    if (bodyCloudMesh?.visible) totalPts += bodyCloudMesh.geometry.attributes.position.count;
    document.getElementById('ptsVal').textContent = totalPts.toLocaleString();
  });

  currentSubs.push(topicObj);
}

function subscribePath(topic) {
  const topicObj = new ROSLIB.Topic({
    ros, name: topic, messageType: 'nav_msgs/Path'
  });

  topicObj.subscribe((msg) => {
    if (!msg.poses||msg.poses.length===0) return;
    updatePathLine(msg.poses);
  });

  currentSubs.push(topicObj);
}

// ============================================================
//  路径 & 轨迹
// ============================================================
function updatePathLine(poses) {
  if (pathLine) {
    overlayGroup.remove(pathLine);
    pathLine.geometry.dispose();
    pathLine.material.dispose();
  }
  const pts = poses.map(p => new THREE.Vector3(p.pose.position.x, p.pose.position.y, p.pose.position.z+0.05));
  const geom = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color:0xff6600, linewidth:1, transparent:true, opacity:0.9 });
  pathLine = new THREE.Line(geom, mat);
  overlayGroup.add(pathLine);
}

function updateTrajectoryLine() {
  if (trajLine) {
    overlayGroup.remove(trajLine);
    trajLine.geometry.dispose();
    trajLine.material.dispose();
    trajLine = null;
  }
  if (trajPoints.length < 2) return;

  const pts = trajPoints.map(p => new THREE.Vector3(p.x, p.y, p.z+0.02));
  const geom = new THREE.BufferGeometry().setFromPoints(pts);

  const colors = [];
  const n = trajPoints.length;
  for (let i=0; i<n; i++) {
    const t = i/(n-1);
    if (t<0.5) colors.push(0, t*2, 1-t*2);
    else colors.push((t-0.5)*2, 1, 0);
  }
  geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

  const mat = new THREE.LineBasicMaterial({ vertexColors:true, linewidth:1, transparent:true, opacity:0.8 });
  trajLine = new THREE.Line(geom, mat);
  overlayGroup.add(trajLine);
}

// ============================================================
//  相机 & UI
// ============================================================
function updateGrid() {
  const oldGrid = overlayGroup.getObjectByName('grid_helper');
  if (oldGrid) overlayGroup.remove(oldGrid);

  if (document.getElementById('chkGrid').checked) {
    const grid = new THREE.GridHelper(100, 50, 0x334466, 0x1a2a3a);
    grid.name = 'grid_helper';
    overlayGroup.add(grid);
  }
}

function setCameraView(view) {
  followMode = false;
  const cam = potreeViewer.scene.getActiveCamera();
  if (!cam) return;

  if (view === 'top') {
    const target = cam.position.clone();
    cam.position.set(target.x, target.y+30, target.z+0.1);
    potreeViewer.scene.view.lookAt(target);
  } else if (view === 'follow') {
    followMode = true;
  } else if (view === 'free') {
    followMode = false;
    potreeViewer.fitToScreen();
  }
}

// ============================================================
//  事件绑定
// ============================================================
document.getElementById('btnConnect').addEventListener('click', () => {
  if (ros?.isConnected) disconnectROS();
  else connectROS();
});

document.getElementById('btnLoadMap').addEventListener('click', () => {
  if (!potreeViewer) return;
  const url = document.getElementById('mapUrl').value.trim();
  const name = document.getElementById('mapName').value.trim();
  if (url) loadPotreeMap(url, name);
});

document.getElementById('btnClear').addEventListener('click', () => {
  [mapCloudMesh, bodyCloudMesh, pathLine, trajLine].forEach(m => {
    if (m) {
      overlayGroup.remove(m);
      if (m.geometry) m.geometry.dispose();
      if (m.material) m.material.dispose();
    }
  });
  mapCloudMesh = null;
  bodyCloudMesh = null;
  pathLine = null;
  trajLine = null;
  trajPoints = [];
  document.getElementById('ptsVal').textContent = '0';
});

// 复选框
['chkMapCloud','chkBodyCloud','chkPath','chkTraj','chkRobot','chkGrid'].forEach(id => {
  document.getElementById(id)?.addEventListener('change', () => {
    if (id==='chkGrid') updateGrid();
    if (id==='chkRobot' && robotModelGroup) {
      robotModelGroup.visible = document.getElementById('chkRobot').checked;
    }
    refreshSubscriptions();
  });
});

// 滑块
document.getElementById('pointSize').addEventListener('input', function() {
  document.getElementById('ptSizeVal').textContent = this.value;
  const sz = parseFloat(this.value)*0.03;
  [mapCloudMesh, bodyCloudMesh].forEach(m => {
    if (m?.material) m.material.size = sz;
  });
});

document.getElementById('voxelSize').addEventListener('input', function() {
  document.getElementById('voxelVal').textContent = this.value;
  refreshSubscriptions();
});

document.getElementById('maxPoints').addEventListener('input', function() {
  const v = parseInt(this.value);
  document.getElementById('maxPtsVal').textContent = v>=1000 ? `${(v/1000).toFixed(0)}k` : v;
  refreshSubscriptions();
});

//  启动
// ============================================================
window.onload = function() {
  initPotree();
  // 自动连接 ROS
  setTimeout(() => {
    const url = document.getElementById('rosUrl').value;
    if (url) connectROS();
  }, 1500);
};
