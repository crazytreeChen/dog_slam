<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Dog SLAM 3D Map Viewer</title>
<script src="libs/roslib.min.js"></script>
<script src="libs/ros3d.min.js"></script>
<!-- Three.js + PCDLoader（从 CDN 加载） -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/PCDLoader.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#111; font-family:'Segoe UI',sans-serif; }
#canvas-container { width:100%; height:100%; display:block; }

#panel {
  position:absolute; top:16px; left:16px; z-index:100;
  width:260px; background:rgba(22,33,62,0.92); border:1px solid #1a4a7a;
  border-radius:8px; padding:14px; color:#eee; font-size:13px;
  backdrop-filter:blur(8px); max-height:calc(100vh - 32px); overflow-y:auto;
}
#panel h3 { font-size:15px; color:#00d4ff; margin-bottom:10px; }
#panel label { display:block; color:#aaa; margin:8px 0 4px; }
#panel input[type="text"], #panel select {
  width:100%; padding:5px 8px; background:#0f3460; color:#eee;
  border:1px solid #1a4a7a; border-radius:4px;
}
#panel button {
  width:100%; padding:7px; margin-top:8px;
  background:#0f3460; color:#00d4ff; border:1px solid #1a4a7a;
  border-radius:4px; cursor:pointer;
}
#panel button:hover { background:#1a4a7a; }
#panel .info { font-size:12px; color:#888; margin-top:6px; word-break:break-all; }
.connected { color:#00ff88; }
.disconnected { color:#ff4444; }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div id="panel">
  <h3>🐕 3D Map Viewer</h3>

  <label>ROS Bridge</label>
  <input id="rosUrl" value="ws://10.0.4.58:9090" />
  <span id="rosStatus" class="disconnected">● disconnected</span>

  <label>3D 地图文件（PCD）</label>
  <select id="mapFile">
    <option value="potree_data/4f.pcd">4f.pcd (166万点)</option>
    <option value="potree_data/campus.pcd">campus.pcd (园区)</option>
  </select>

  <label>固定坐标系</label>
  <select id="fixedFrame">
    <option value="rkbot/odom">rkbot/odom</option>
    <option value="rkbot/map">rkbot/map</option>
    <option value="map">map</option>
  </select>

  <label>实时点云</label>
  <select id="cloudTopic">
    <option value="">关闭</option>
    <option value="/rkbot/lio/body/cloud" selected>/rkbot/lio/body/cloud</option>
    <option value="/rkbot/livox/lidar">/rkbot/livox/lidar</option>
    <option value="/cloud_registered_body">/cloud_registered_body</option>
  </select>

  <label>规划路径</label>
  <select id="pathTopic">
    <option value="">关闭</option>
    <option value="/planned_path" selected>/planned_path</option>
    <option value="/plan">/plan</option>
  </select>

  <label>点云大小</label>
  <input id="pointSize" type="range" min="1" max="5" value="2" step="0.5" />

  <button onclick="loadMap()">加载地图</button>
  <button onclick="connectROS()">连接 ROS</button>

  <div class="info" id="statusInfo">等待操作...</div>
</div>

<script>
// ===== 全局状态 =====
let scene, camera, renderer, controls;
let ros, tfClient, cloudSub, pathSub;
let mapPoints = null;
let clock = new THREE.Clock();

// ===== 初始化 Three.js 场景 =====
function initScene() {
  const container = document.getElementById('canvas-container');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111122);

  // 相机
  camera = new THREE.PerspectiveCamera(60, container.clientWidth/container.clientHeight, 0.1, 1000);
  camera.position.set(10, 5, 15);

  // 渲染器
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // 控制器
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.1;
  controls.target.set(0, 0, 0);
  controls.maxPolarAngle = Math.PI / 2;

  // 网格地面
  const grid = new THREE.GridHelper(100, 50, 0x444466, 0x333355);
  scene.add(grid);

  // 灯光
  const ambient = new THREE.AmbientLight(0x404060);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(10, 20, 10);
  scene.add(dirLight);

  // 窗口大小变化
  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// ===== 加载 PCD 地图 =====
function loadMap() {
  const url = document.getElementById('mapFile').value;
  const info = document.getElementById('statusInfo');

  // 移除旧地图
  if (mapPoints) {
    scene.remove(mapPoints);
    mapPoints.geometry.dispose();
    mapPoints.material.dispose();
    mapPoints = null;
  }

  info.textContent = '加载地图中...';

  const loader = new THREE.PCDLoader();
  loader.load(url,
    function(points) {
      // 成功
      points.material.size = parseFloat(document.getElementById('pointSize').value) * 0.01;
      points.material.color.setHex(0x00cc88);
      points.material.opacity = 0.9;
      points.material.transparent = true;
      scene.add(points);
      mapPoints = points;

      // 自动适配视角
      const box = new THREE.Box3().setFromObject(points);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);

      controls.target.copy(center);
      camera.position.set(
        center.x + maxDim * 0.8,
        center.y + maxDim * 0.3,
        center.z + maxDim * 0.8
      );
      controls.update();

      info.textContent = `✅ 地图加载成功: ${(points.geometry.attributes.position.count/10000).toFixed(1)}万点`;
    },
    function(xhr) {
      if (xhr.total > 0) {
        const pct = Math.round(xhr.loaded / xhr.total * 100);
        info.textContent = `加载中... ${pct}%`;
      }
    },
    function(err) {
      info.textContent = `❌ 加载失败: ${err}`;
      console.error(err);
    }
  );
}

// ===== ROS 连接 =====
function connectROS() {
  const url = document.getElementById('rosUrl').value;
  const status = document.getElementById('rosStatus');

  if (ros) { ros.close(); }

  ros = new ROSLIB.Ros({ url });

  ros.on('connection', () => {
    status.textContent = '● connected';
    status.className = 'connected';
    initROS();
  });
  ros.on('close', () => {
    status.textContent = '● disconnected';
    status.className = 'disconnected';
  });
  ros.on('error', () => {
    status.textContent = '● error';
    status.className = 'disconnected';
  });
}

function initROS() {
  tfClient = new ROSLIB.TFClient({
    ros, angularThres: 0.01, transThres: 0.01, rate: 10.0,
    fixedFrame: document.getElementById('fixedFrame').value
  });
  subscribeCloud();
  subscribePath();
}

function subscribeCloud() {
  if (cloudSub) { cloudSub.unsubscribe(); }
  const topic = document.getElementById('cloudTopic').value;
  if (!topic || !ros?.isConnected) return;
  cloudSub = new ROS3D.PointCloud2({
    ros, tfClient,
    topic,
    rootObject: scene,
    material: { size: 0.08, color: 0x00ff88 },
    max_pts: 50000
  });
}

function subscribePath() {
  if (pathSub) { pathSub.unsubscribe(); }
  const topic = document.getElementById('pathTopic').value;
  if (!topic || !ros?.isConnected) return;
  pathSub = new ROS3D.Path({
    ros, tfClient,
    topic, rootObject: scene,
    color: 0xff6600, linewidth: 4
  });
}

// ===== 事件绑定 =====
document.getElementById('cloudTopic').onchange = subscribeCloud;
document.getElementById('pathTopic').onchange = subscribePath;
document.getElementById('fixedFrame').onchange = () => {
  if (ros?.isConnected) {
    tfClient = new ROSLIB.TFClient({
      ros, angularThres: 0.01, transThres: 0.01, rate: 10.0,
      fixedFrame: document.getElementById('fixedFrame').value
    });
  }
};
document.getElementById('pointSize').oninput = () => {
  if (mapPoints) {
    mapPoints.material.size = parseFloat(document.getElementById('pointSize').value) * 0.01;
  }
};

// ===== 启动 =====
window.onload = () => {
  initScene();
  setTimeout(loadMap, 500);
};
</script>
</body>
</html>
