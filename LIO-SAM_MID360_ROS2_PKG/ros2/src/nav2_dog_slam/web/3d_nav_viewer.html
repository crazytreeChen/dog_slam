<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
//  全局引用
// ============================================================
const viewerEl = document.getElementById('viewer');
let scene, camera, renderer, controls;
let ros = null;
let tfClient = null;
let robotModelGroup = null;
let lastRobotPos = new THREE.Vector3();
let lastRobotQuat = new THREE.Quaternion();

// 点云相关
let mapCloudMesh = null;      // 降采样地图点云
let bodyCloudMesh = null;     // 机体实时点云
let worldCloudMesh = null;    // 原始世界点云
let pathLine = null;          // 导航路径线
let trajLine = null;          // 轨迹线
let trajPoints = [];          // 累积轨迹点 [{x,y,z}]

// 机器人模型组件引用
let robotBody, robotArrow;

// 降采样器
let voxelMaps = { map: new Map(), body: new Map(), world: new Map() };

// 统计
let frameCount = 0, lastFpsTime = performance.now(), currentFps = 0;
const COLOR_BLUE = new THREE.Color(0x1a6eff);
const COLOR_RED = new THREE.Color(0xff3333);
const COLOR_GREEN = new THREE.Color(0x00ff88);

// ============================================================
//  工具函数
// ============================================================

/** PointCloud2 二进制解析 */
function parsePointCloud2Data(data, fields, point_step, totalPoints, is_bigendian) {
  const positions = new Float32Array(totalPoints * 3);
  const intensities = new Float32Array(totalPoints);

  // 查找字段偏移
  let xOff = -1, yOff = -1, zOff = -1, iOff = -1;
  for (const f of fields) {
    if (f.name === 'x') xOff = f.offset;
    else if (f.name === 'y') yOff = f.offset;
    else if (f.name === 'z') zOff = f.offset;
    else if (f.name === 'intensity' || f.name === 'intensities') iOff = f.offset;
  }
  if (xOff < 0 || yOff < 0 || zOff < 0) return { positions: new Float32Array(0) };

  const dv = new DataView(data.buffer, data.byteOffset || 0, data.byteLength);
  const le = !is_bigendian;
  let validCount = 0;

  for (let i = 0; i < totalPoints; i++) {
    const off = i * point_step;
    const x = dv.getFloat32(off + xOff, le);
    const y = dv.getFloat32(off + yOff, le);
    const z = dv.getFloat32(off + zOff, le);

    if (isNaN(x) || isNaN(y) || isNaN(z)) continue;
    if (!isFinite(x) || !isFinite(y) || !isFinite(z)) continue;

    const j = validCount;
    positions[j * 3] = x;
    positions[j * 3 + 1] = y;
    positions[j * 3 + 2] = z;

    if (iOff >= 0) {
      intensities[j] = dv.getFloat32(off + iOff, le) || 0;
    }
    validCount++;
  }

  return {
    positions: validCount < totalPoints ? positions.subarray(0, validCount * 3) : positions,
    intensities: validCount < totalPoints ? intensities.subarray(0, validCount) : intensities,
    count: validCount
  };
}

/** 获取消息的二进制数据（兼容 base64 字符串） */
function getMsgData(msg) {
  if (!msg || !msg.data) return null;
  if (msg.data instanceof Uint8Array) return msg.data;
  if (msg.data instanceof ArrayBuffer) return new Uint8Array(msg.data);
  if (typeof msg.data === 'string') {
    try {
      const raw = atob(msg.data);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      return bytes;
    } catch (e) {
      console.warn('base64 decode failed:', e);
      return null;
    }
  }
  return null;
}

/** 体素降采样（空间哈希） */
function voxelDownsample(positions, resolution) {
  const map = new Map();
  const n = positions.length / 3;
  for (let i = 0; i < n; i++) {
    const x = positions[i * 3];
    const y = positions[i * 3 + 1];
    const z = positions[i * 3 + 2];
    const ix = Math.floor(x / resolution);
    const iy = Math.floor(y / resolution);
    const iz = Math.floor(z / resolution);
    const key = `${ix},${iy},${iz}`;
    if (!map.has(key)) {
      map.set(key, { x, y, z });
    }
  }
  return map;
}

/** 高度→颜色映射 */
function heightColor(z, zMin, zMax) {
  if (zMax <= zMin) return new THREE.Color(0x00ff88);
  const t = Math.max(0, Math.min(1, (z - zMin) / (zMax - zMin)));
  // blue(0,0,1) -> cyan(0,1,1) -> green(0,1,0) -> yellow(1,1,0) -> red(1,0,0)
  if (t < 0.25) return new THREE.Color(0, t * 4, 1);
  if (t < 0.5)  return new THREE.Color(0, 1, 1 - (t - 0.25) * 4);
  if (t < 0.75) return new THREE.Color((t - 0.5) * 4, 1, 0);
  return new THREE.Color(1, 1 - (t - 0.75) * 4, 0);
}

/** 从 voxel map 创建/更新 Three.js Points */
function updatePointCloudMesh(mesh, voxelMap, pointSize, useHeightColor) {
  const points = Array.from(voxelMap.values());
  const numPoints = points.length;

  if (numPoints === 0) {
    if (mesh) mesh.visible = false;
    return mesh;
  }

  const positionsArr = new Float32Array(numPoints * 3);
  const colorsArr = new Float32Array(numPoints * 3);

  let zMin = Infinity, zMax = -Infinity;
  if (useHeightColor) {
    for (const p of points) {
      if (p.z < zMin) zMin = p.z;
      if (p.z > zMax) zMax = p.z;
    }
  }
  if (zMax <= zMin) { zMin = -5; zMax = 5; }

  for (let i = 0; i < numPoints; i++) {
    const p = points[i];
    positionsArr[i * 3] = p.x;
    positionsArr[i * 3 + 1] = p.y;
    positionsArr[i * 3 + 2] = p.z;

    const col = useHeightColor ? heightColor(p.z, zMin, zMax) : COLOR_GREEN;
    colorsArr[i * 3] = col.r;
    colorsArr[i * 3 + 1] = col.g;
    colorsArr[i * 3 + 2] = col.b;
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positionsArr, 3));
  geom.setAttribute('color', new THREE.BufferAttribute(colorsArr, 3));

  const mat = new THREE.PointsMaterial({
    size: pointSize * 0.03,
    vertexColors: true,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0.85
  });

  if (mesh) {
    mesh.geometry.dispose();
    mesh.material.dispose();
  }

  const newMesh = new THREE.Points(geom, mat);
  newMesh.visible = true;
  return newMesh;
}

// ============================================================
//  机器人 3D 模型
// ============================================================
function createRobotModel() {
  const group = new THREE.Group();

  // 主体 (蓝色半透明盒子)
  const bodyGeom = new THREE.BoxGeometry(0.6, 0.2, 0.35);
  const bodyMat = new THREE.MeshPhongMaterial({
    color: 0x1a8aff, emissive: 0x001133,
    transparent: true, opacity: 0.85
  });
  robotBody = new THREE.Mesh(bodyGeom, bodyMat);
  robotBody.position.y = 0.15;
  group.add(robotBody);

  // 方向箭头 (红色圆锥)
  const arrowGeom = new THREE.ConeGeometry(0.08, 0.25, 8);
  const arrowMat = new THREE.MeshPhongMaterial({
    color: 0xff3333, emissive: 0x330000
  });
  robotArrow = new THREE.Mesh(arrowGeom, arrowMat);
  robotArrow.position.set(0.35, 0.25, 0);
  robotArrow.rotation.x = Math.PI / 2;
  group.add(robotArrow);

  // 四足 (小圆柱)
  const legGeom = new THREE.CylinderGeometry(0.04, 0.04, 0.15, 8);
  const legMat = new THREE.MeshPhongMaterial({ color: 0x556677 });
  const legPositions = [
    [0.22, 0.08, 0.14], [0.22, 0.08, -0.14],
    [-0.22, 0.08, 0.14], [-0.22, 0.08, -0.14]
  ];
  for (const [lx, ly, lz] of legPositions) {
    const leg = new THREE.Mesh(legGeom, legMat);
    leg.position.set(lx, ly, lz);
    group.add(leg);
  }

  group.visible = false;
  return group;
}

function updateRobotPose(pos, quat) {
  if (!robotModelGroup) return;
  robotModelGroup.visible = true;
  robotModelGroup.position.copy(pos);

  // 将 ROS 四元数 (x,y,z,w) 转为 Three.js (w,x,y,z 顺序不同)
  const q = new THREE.Quaternion(quat.x, quat.y, quat.z, quat.w);
  robotModelGroup.quaternion.copy(q);

  lastRobotPos.copy(pos);
  lastRobotQuat.copy(q);
}

// ============================================================
//  Three.js 场景初始化
// ============================================================
function initScene() {
  // 场景
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0d1a);
  scene.fog = new THREE.Fog(0x0a0d1a, 30, 150);

  // 相机
  const w = viewerEl.clientWidth, h = viewerEl.clientHeight;
  camera = new THREE.PerspectiveCamera(55, w / h, 0.2, 500);
  camera.position.set(8, 6, 12);
  camera.lookAt(0, 0, 0);

  // 渲染器
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  viewerEl.appendChild(renderer.domElement);

  // OrbitControls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 0, 0);
  controls.maxPolarAngle = Math.PI * 0.48;
  controls.minDistance = 1;
  controls.maxDistance = 200;
  controls.update();

  // 光照
  const ambient = new THREE.AmbientLight(0x334466, 1.2);
  scene.add(ambient);
  const hemi = new THREE.HemisphereLight(0x8899cc, 0x223344, 0.6);
  scene.add(hemi);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(15, 25, 10);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  dirLight.shadow.camera.near = 0.5;
  dirLight.shadow.camera.far = 100;
  dirLight.shadow.camera.left = -30;
  dirLight.shadow.camera.right = 30;
  dirLight.shadow.camera.top = 30;
  dirLight.shadow.camera.bottom = -30;
  scene.add(dirLight);

  // 网格地面
  updateGrid();

  // 坐标轴
  updateAxes();

  // 机器人模型
  robotModelGroup = createRobotModel();
  scene.add(robotModelGroup);

  // 接收阴影的地面
  const groundGeom = new THREE.PlaneGeometry(200, 200);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x1a1a2e, roughness: 0.8, metalness: 0.1
  });
  const ground = new THREE.Mesh(groundGeom, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.01;
  ground.receiveShadow = true;
  scene.add(ground);

  // 窗口大小
  window.addEventListener('resize', () => {
    const w2 = viewerEl.clientWidth, h2 = viewerEl.clientHeight;
    camera.aspect = w2 / h2;
    camera.updateProjectionMatrix();
    renderer.setSize(w2, h2);
  });

  // 动画循环
  function animate() {
    requestAnimationFrame(animate);

    // 跟随模式：相机跟踪机器人
    if (followMode && robotModelGroup?.visible) {
      controls.target.lerp(robotModelGroup.position, 0.05);
    }

    controls.update();
    renderer.render(scene, camera);

    // FPS
    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
      currentFps = Math.round(frameCount / ((now - lastFpsTime) / 1000));
      document.getElementById('fpsVal').textContent = currentFps;
      frameCount = 0;
      lastFpsTime = now;

      // 更新机器人位姿显示
      if (robotModelGroup && robotModelGroup.visible) {
        const p = lastRobotPos;
        document.getElementById('poseVal').textContent =
          `${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)}`;
      }
    }
  }
  animate();
}

function updateGrid() {
  // 移除旧网格
  const oldGrid = scene.getObjectByName('grid');
  if (oldGrid) scene.remove(oldGrid);

  if (document.getElementById('chkGrid').checked) {
    const grid = new THREE.GridHelper(100, 50, 0x334466, 0x1a2a3a);
    grid.name = 'grid';
    scene.add(grid);
  }
}

function updateAxes() {
  const oldAxes = scene.getObjectByName('axes');
  if (oldAxes) scene.remove(oldAxes);

  if (document.getElementById('chkAxes').checked) {
    const axes = new THREE.AxesHelper(5);
    axes.name = 'axes';
    scene.add(axes);
  }
}

// ============================================================
//  ROS 连接
// ============================================================
function connectROS() {
  const url = document.getElementById('rosUrl').value.trim();
  if (!url) return;

  if (ros) {
    ros.close();
    ros = null;
  }

  ros = new ROSLIB.Ros({ url });

  const dot = document.getElementById('rosDot');
  const txt = document.getElementById('rosStatusText');
  const btn = document.getElementById('btnConnect');

  ros.on('connection', () => {
    dot.className = 'dot on';
    txt.textContent = `已连接 ${url}`;
    btn.textContent = '断开';
    btn.classList.add('warn');
    btn.classList.remove('primary');
    initROSSubscriptions();
  });

  ros.on('close', () => {
    dot.className = 'dot off';
    txt.textContent = '已断开';
    btn.textContent = '连接';
    btn.classList.add('primary');
    btn.classList.remove('warn');
  });

  ros.on('error', (err) => {
    dot.className = 'dot off';
    txt.textContent = '连接错误';
    console.error('ROS error:', err);
  });
}

function disconnectROS() {
  if (tfClient) { tfClient.dispose(); tfClient = null; }
  if (ros) { ros.close(); ros = null; }
}

// ============================================================
//  话题订阅
// ============================================================
let currentSubs = [];

function unsubscribeAll() {
  for (const sub of currentSubs) {
    try { sub.unsubscribe(); } catch (e) {}
  }
  currentSubs = [];
}

function initROSSubscriptions() {
  if (!ros || !ros.isConnected) return;
  unsubscribeAll();

  // TF Client
  if (tfClient) tfClient.dispose();
  tfClient = new ROSLIB.TFClient({
    ros,
    angularThres: 0.05,
    transThres: 0.05,
    rate: 10.0,
    fixedFrame: 'map'
  });

  // 机器人位姿追踪
  const ns = document.getElementById('namespace').value.trim();
  const targetFrame = ns ? `${ns}/base_footprint` : 'base_footprint';
  subscribeTF(targetFrame);

  // 根据勾选订阅
  refreshSubscriptions();
}

let lastTrajTime = 0;
function subscribeTF(targetFrame) {
  // 使用 TFClient.subscribe 追踪 map -> base_footprint
  tfClient.subscribe('map', targetFrame, (tf) => {
    updateRobotPose(
      new THREE.Vector3(tf.translation.x, tf.translation.y, tf.translation.z),
      tf.rotation
    );

    // 累积轨迹（节流：每200ms最多记录一次，最多保留10000点）
    if (document.getElementById('chkTraj').checked) {
      const now = performance.now();
      if (now - lastTrajTime > 200) {
        lastTrajTime = now;
        trajPoints.push({
          x: tf.translation.x,
          y: tf.translation.y,
          z: tf.translation.z
        });
        // 限制轨迹点数
        const MAX_TRAJ = 10000;
        if (trajPoints.length > MAX_TRAJ) {
          trajPoints = trajPoints.slice(-MAX_TRAJ);
        }
        updateTrajectoryLine();
      }
    }
  });
}

function refreshSubscriptions() {
  if (!ros?.isConnected) return;
  unsubscribeAll();

  // 重新订阅 TF
  const ns = document.getElementById('namespace').value.trim();
  const targetFrame = ns ? `${ns}/base_footprint` : 'base_footprint';
  if (tfClient) tfClient.dispose();
  tfClient = new ROSLIB.TFClient({
    ros, angularThres: 0.05, transThres: 0.05, rate: 10.0, fixedFrame: 'map'
  });
  subscribeTF(targetFrame);

  const pointSize = parseFloat(document.getElementById('pointSize').value) || 2;
  const voxelSize = parseFloat(document.getElementById('voxelSize').value) || 0.5;
  const maxPts = parseInt(document.getElementById('maxPoints').value) || 200000;
  const useHeightColor = document.getElementById('chkColorHeight').checked;

  // 地图点云
  if (document.getElementById('chkMapCloud').checked) {
    const topic = document.getElementById('mapCloudTopic').value.trim();
    if (topic) subscribeCloud(topic, 'map', pointSize, voxelSize, maxPts, useHeightColor);
  }
  // 机体点云
  if (document.getElementById('chkBodyCloud').checked) {
    const topic = document.getElementById('bodyCloudTopic').value.trim();
    if (topic) subscribeCloud(topic, 'body', pointSize, voxelSize, maxPts, useHeightColor);
  }
  // 原始世界点云
  if (document.getElementById('chkWorldCloud').checked) {
    const topic = document.getElementById('worldCloudTopic').value.trim();
    if (topic) subscribeCloud(topic, 'world', pointSize, voxelSize, maxPts, useHeightColor);
  }
  // 导航路径
  if (document.getElementById('chkPath').checked) {
    const topic = document.getElementById('pathTopic').value.trim();
    if (topic) subscribePath(topic);
  }

  // 机器人模型可见性
  if (robotModelGroup) {
    robotModelGroup.visible = document.getElementById('chkRobot').checked;
  }
}

let lastCloudTime = {};
function subscribeCloud(topic, type, pointSize, voxelSize, maxPts, useHeightColor) {
  const topicObj = new ROSLIB.Topic({
    ros,
    name: topic,
    messageType: 'sensor_msgs/PointCloud2',
    throttle_rate: 200  // 最多 5Hz
  });

  topicObj.subscribe((msg) => {
    // 节流
    const now = performance.now();
    if (lastCloudTime[topic] && now - lastCloudTime[topic] < 200) return;
    lastCloudTime[topic] = now;

    const data = getMsgData(msg);
    if (!data) return;

    const totalPoints = msg.width * msg.height;
    if (totalPoints === 0) return;

    const parsed = parsePointCloud2Data(
      data, msg.fields, msg.point_step, totalPoints, msg.is_bigendian
    );
    if (parsed.count === 0) return;

    // 降采样
    const voxelMap = voxelDownsample(parsed.positions, voxelSize);

    // 限制最大点数
    if (voxelMap.size > maxPts) {
      const entries = Array.from(voxelMap.entries());
      const toRemove = voxelMap.size - maxPts;
      for (let i = 0; i < toRemove; i++) {
        const idx = Math.floor(Math.random() * entries.length);
        voxelMap.delete(entries[idx][0]);
        entries.splice(idx, 1);
      }
    }

    // 创建/更新 mesh
    let meshVar, meshName;
    if (type === 'map') { meshVar = mapCloudMesh; meshName = 'mapCloudMesh'; }
    else if (type === 'body') { meshVar = bodyCloudMesh; meshName = 'bodyCloudMesh'; }
    else { meshVar = worldCloudMesh; meshName = 'worldCloudMesh'; }

    const oldMesh = meshVar;
    const newMesh = updatePointCloudMesh(oldMesh, voxelMap, pointSize, useHeightColor);

    if (oldMesh && oldMesh !== newMesh) {
      scene.remove(oldMesh);
      if (oldMesh.geometry) oldMesh.geometry.dispose();
      if (oldMesh.material) oldMesh.material.dispose();
    }
    if (newMesh && newMesh !== oldMesh) {
      scene.add(newMesh);
    }

    if (type === 'map') mapCloudMesh = newMesh;
    else if (type === 'body') bodyCloudMesh = newMesh;
    else worldCloudMesh = newMesh;

    // 更新点数显示
    let totalPts = 0;
    if (mapCloudMesh?.visible) totalPts += mapCloudMesh.geometry.attributes.position.count;
    if (bodyCloudMesh?.visible) totalPts += bodyCloudMesh.geometry.attributes.position.count;
    if (worldCloudMesh?.visible) totalPts += worldCloudMesh.geometry.attributes.position.count;
    document.getElementById('ptsVal').textContent = totalPts.toLocaleString();
  });

  currentSubs.push(topicObj);
}

function subscribePath(topic) {
  const topicObj = new ROSLIB.Topic({
    ros,
    name: topic,
    messageType: 'nav_msgs/Path'
  });

  topicObj.subscribe((msg) => {
    if (!msg.poses || msg.poses.length === 0) return;
    updatePathLine(msg.poses);
  });

  currentSubs.push(topicObj);
}

// ============================================================
//  路径与轨迹渲染
// ============================================================
function updatePathLine(poses) {
  if (pathLine) {
    scene.remove(pathLine);
    pathLine.geometry.dispose();
    pathLine.material.dispose();
    pathLine = null;
  }

  const points3D = poses.map(p => new THREE.Vector3(
    p.pose.position.x,
    p.pose.position.y,
    p.pose.position.z + 0.05
  ));

  const geom = new THREE.BufferGeometry().setFromPoints(points3D);
  const mat = new THREE.LineBasicMaterial({
    color: 0xff6600,
    linewidth: 1,
    transparent: true,
    opacity: 0.9
  });

  pathLine = new THREE.Line(geom, mat);
  scene.add(pathLine);
}

function updateTrajectoryLine() {
  if (trajLine) {
    scene.remove(trajLine);
    trajLine.geometry.dispose();
    trajLine.material.dispose();
    trajLine = null;
  }

  if (trajPoints.length < 2) return;

  const points3D = trajPoints.map(p => new THREE.Vector3(p.x, p.y, p.z + 0.02));
  const geom = new THREE.BufferGeometry().setFromPoints(points3D);

  // 渐变色
  const colors = [];
  const n = trajPoints.length;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    // blue -> cyan -> yellow
    const c = new THREE.Color();
    if (t < 0.5) c.setRGB(0, t * 2, 1 - t * 2);
    else c.setRGB((t - 0.5) * 2, 1, 0);
    colors.push(c.r, c.g, c.b);
  }
  geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

  const mat = new THREE.LineBasicMaterial({
    vertexColors: true,
    linewidth: 1,
    transparent: true,
    opacity: 0.8
  });

  trajLine = new THREE.Line(geom, mat);
  scene.add(trajLine);
}

// ============================================================
//  相机控制
// ============================================================
let followMode = false;

function setCameraView(view) {
  followMode = false;

  if (view === 'top') {
    const target = controls.target.clone();
    camera.position.set(target.x, target.y + 30, target.z + 0.1);
    controls.target.copy(target);
    controls.update();
  } else if (view === 'follow') {
    followMode = true;
  } else if (view === 'free') {
    followMode = false;
    // 重置到较好视角
    const center = new THREE.Vector3(0, 0, 0);
    if (mapCloudMesh?.visible && mapCloudMesh.geometry) {
      try {
        mapCloudMesh.geometry.computeBoundingBox();
        const box = mapCloudMesh.geometry.boundingBox;
        if (box) box.getCenter(center);
      } catch (e) {}
    }
    camera.position.set(center.x + 10, center.y + 5, center.z + 15);
    controls.target.copy(center);
    controls.update();
  }
}

// 暴露到全局 (HTML onclick 调用)
window.setCameraView = setCameraView;

// ============================================================
//  UI 事件绑定
// ============================================================
document.getElementById('btnConnect').addEventListener('click', () => {
  if (ros?.isConnected) {
    disconnectROS();
  } else {
    connectROS();
  }
});

// 模式切换
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');

    const mode = tab.dataset.mode;
    document.getElementById('modeTag').textContent = mode === 'mapping' ? '建图模式' : '导航模式';

    // 建图模式：默认开启地图点云
    if (mode === 'mapping') {
      document.getElementById('chkMapCloud').checked = true;
      document.getElementById('chkWorldCloud').checked = true;
      document.getElementById('chkBodyCloud').checked = false;
      document.getElementById('chkPath').checked = false;
    } else {
      // 导航模式：开启机体点云和路径
      document.getElementById('chkMapCloud').checked = true;
      document.getElementById('chkWorldCloud').checked = false;
      document.getElementById('chkBodyCloud').checked = true;
      document.getElementById('chkPath').checked = true;
    }
    refreshSubscriptions();
  });
});

// 复选框变化
['chkMapCloud','chkBodyCloud','chkWorldCloud','chkPath','chkTraj','chkRobot',
 'chkColorHeight','chkGrid','chkAxes'].forEach(id => {
  document.getElementById(id)?.addEventListener('change', () => {
    if (id === 'chkGrid') updateGrid();
    if (id === 'chkAxes') updateAxes();
    if (id === 'chkRobot') {
      if (robotModelGroup) robotModelGroup.visible = document.getElementById('chkRobot').checked;
    }
    if (['chkMapCloud','chkBodyCloud','chkWorldCloud','chkPath','chkTraj'].includes(id)) {
      refreshSubscriptions();
    }
  });
});

// 滑块
document.getElementById('pointSize').addEventListener('input', function() {
  document.getElementById('ptSizeVal').textContent = this.value;
  const sz = parseFloat(this.value) * 0.03;
  [mapCloudMesh, bodyCloudMesh, worldCloudMesh].forEach(m => {
    if (m?.material) m.material.size = sz;
  });
});

document.getElementById('voxelSize').addEventListener('input', function() {
  document.getElementById('voxelVal').textContent = this.value;
  refreshSubscriptions();
});

document.getElementById('maxPoints').addEventListener('input', function() {
  const v = parseInt(this.value);
  document.getElementById('maxPtsVal').textContent = v >= 1000 ? `${(v/1000).toFixed(0)}k` : v;
  refreshSubscriptions();
});

// 清除按钮
document.getElementById('btnClear').addEventListener('click', () => {
  // 清除点云
  [mapCloudMesh, bodyCloudMesh, worldCloudMesh].forEach(m => {
    if (m) {
      scene.remove(m);
      if (m.geometry) m.geometry.dispose();
      if (m.material) m.material.dispose();
    }
  });
  mapCloudMesh = null;
  bodyCloudMesh = null;
  worldCloudMesh = null;

  // 清除路径
  if (pathLine) {
    scene.remove(pathLine);
    pathLine.geometry.dispose();
    pathLine.material.dispose();
    pathLine = null;
  }

  // 清除轨迹
  if (trajLine) {
    scene.remove(trajLine);
    trajLine.geometry.dispose();
    trajLine.material.dispose();
    trajLine = null;
  }
  trajPoints = [];

  document.getElementById('ptsVal').textContent = '0';
});

// ============================================================
//  启动
// ============================================================
initScene();
// 自动连接（如果已有 rosbridge）
setTimeout(() => {
  const url = document.getElementById('rosUrl').value;
  if (url) connectROS();
}, 1000);
