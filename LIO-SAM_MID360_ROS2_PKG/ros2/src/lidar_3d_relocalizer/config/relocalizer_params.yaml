lidar_3d_relocalizer_node:
  ros__parameters:
    # ─── PCD 地图 ───
    pcd_map_path: "/home/ztl/slam_data/pcd/test.pcd"

    # ─── 坐标系（必须与 AMCL / Nav2 一致）───
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_footprint"

    # ─── 话题（根据 LIO 算法自适应，launch 中覆盖）───
    cloud_topic: "/lio/body/cloud"      # Super-LIO: /lio/body/cloud; Fast-LIO: /cloud_registered_body
    odom_topic: "/lio/odom"             # Super-LIO: /lio/odom; Fast-LIO: /Odometry
    initialpose_topic: "/initialpose"   # 命名空间模式下自动加前缀
    status_topic: "/relocalizer/status"

    # ─── 多帧点云累积参数 ───
    # 核心思路：累积云越稠密，KISS-Matcher 的 FPFH 特征越可靠
    # 体素从 0.15 降到 0.08：理论上点数增约 6.6x（=0.15³/0.08³），
    # 但受限于 MID360 窄视场角 + 静止机器人，实际约 3-5x
    accum_frame_count: 120        # 增加到 120 帧，覆盖更多视场范围
    accum_max_time_sec: 20.0      # 最长累积 20 秒（10Hz LIO=200 帧上限）
    accum_voxel_size: 0.08        # 体素 8cm，平衡密度与速度（0.15→5k 点，0.08→预估 15-25k 点）

    # ─── KISS-Matcher 全局匹配参数 ───
    kiss_matcher_voxel_size: 0.25  # 体素过滤：大值=更少但更区分特征，提高收敛稳定性

    # ─── GICP 精细配准参数 ───
    gicp_voxel_size: 0.2           # 适度降采样
    gicp_max_iterations: 100       # 更多迭代次数
    gicp_trans_eps: 1e-5           # 放宽收敛条件（之前 1e-8 太严格，从不收敛）
    gicp_rot_eps: 1e-5
    gicp_fitness_threshold: 0.5   # fitness > 此值视为退化场景，拒绝发布

    # ─── 行为控制 ───
    relocalize_rate_hz: 0.5       # 重定位尝试频率（Hz）
    publish_tf: false             # 不发布 map→odom TF（避免与 AMCL 冲突）
    publish_initial_pose: true    # 发布 /initialpose 给 AMCL
    max_retry: 3                  # 最大重试次数，超过后停止

    # ─── 原地旋转采集（扩展 MID360 窄视场角）───
    # 静止机器人的 70° FOV FPFH 特征不足以全局匹配 60 万点地图。
    # 旋转一圈可覆盖 360° 环境，累积 120+ 帧不同视角点云，极大提高匹配成功率。
    rotate_enable: false           # 是否启用旋转采集（默认关闭）
    rotate_angular_speed: 0.30     # 旋转角速度 (rad/s)，0.3≈每圈 21 秒
    rotate_total_angle_deg: 360.0  # 总旋转角度（度）
    rotate_cmd_vel_topic: "/cmd_vel"  # 速度指令话题

    # ─── 旋转避障参数 ───
    # 基于实时点云检测旋转方向是否有障碍物，确保旋转安全
    rotate_obstacle_check: true    # 是否启用旋转避障
    rotate_obstacle_min_dist: 0.50 # 障碍物最小安全距离（米）
    rotate_obstacle_check_range_deg: 45.0  # 检测扇形角度范围（度）

    # ─── PCD → 2D 地图坐标偏移 ───
    # PCD 地图原点在 2D 地图坐标系中的位置
    # 计算方法: 2D坐标 - PCD坐标 = 偏移量
    # fallback: 3 组人工点固定尺度最小二乘估计值
    map_offset_x: -0.034788
    map_offset_y: 0.123770
    map_offset_yaw_deg: -2.471985

    # PCD -> 2D map alignment.
    # offset: use map_offset_x/map_offset_y/map_offset_yaw_deg.
    # landmarks: estimate scale + yaw + translation from marked point pairs.
    alignment_mode: "landmarks"
    # Keep false for ROS/Nav2 metric maps. Enable only when map scale is known to differ.
    alignment_allow_scale: false
    # 0=不检查点数，直接走 KISS-Matcher 单帧匹配（累积云回退到单帧也能用）
    # MID360 单帧约 20k+ 原始点，FPFH 特征在稠密场景下可工作
    min_relocalize_points: 0
    min_kiss_translation_inliers: 6
    allow_kiss_fallback: false

    # ─── KISS-Matcher 降级容错 ───
    # 当 KISS trans inliers < min_kiss_translation_inliers 但 rot inliers >= 此值时，
    # 触发 rotation-only fallback + 多方向旋转搜索（无论 KISS 是否报告 valid=true）。
    # 这避免了退化环境中 KISS 几乎随机的平移结果被喂给 GICP。
    # centroid alignment: t = src_centroid - R * tgt_centroid
    # 在 KISS rotation 附近采样多个 yaw 候选做 GICP，选 fitness 最好的。
    min_rotation_inliers: 5

    # ─── 多方向旋转搜索（rotation-only fallback 时启用）───
    # 原理：KISS rotation 在退化环境中可能偏 10-30°，
    # 单一 centroid alignment 初值可能不足以让 GICP 收敛。
    # 在 KISS rotation ±range 内均匀采样 N 个候选角度，
    # 每个做 centroid alignment → GICP，选 fitness 最小的。
    enable_multi_yaw_search: true       # 是否启用多方向搜索
    multi_yaw_search_samples: 7         # 候选角度数（含 0°），奇数可保证包含原始 KISS 角度
    multi_yaw_search_range_deg: 30.0    # 搜索范围 ±30°
    # 当 KISS 完全失败时，是否启用 GICP 兜底（identity 初值 + 缩小搜索半径）
    enable_gicp_fallback: true
    # GICP 兜底时的搜索窗口半径（米），比正常搜索窗口小
    gicp_fallback_search_radius: 5.0
    # Flattened point pairs: [pcd_x, pcd_y, map_x, map_y, ...]
    # One point gives translation only; 2+ points estimate yaw/scale/translation.
    # 3+ manually marked correspondences are recommended for production.
    alignment_points: [
      -1.65958, -3.69628, -3.17743, -3.71891,
      -11.11288, -11.18596, -10.42140, -10.11060,
      16.66528, -6.13897, 16.47700, -6.96873
    ]

    # ─── 发布模式 ───
    # "2d": 只发布 x, y, yaw（用于 AMCL 定位）
    # "3d": 发布完整 6DOF（用于 3D 定位系统）
    initial_pose_mode: "2d"

    # ─── 搜索窗口 ───
    # 裁剪 PCD 地图到以累积云质心为中心的局部区域（仅 XY 平面）
    # 0 = 不裁剪（全局搜索），>0 = 裁剪半径（米）
    # 注意：PCD 地图在 map 系，累积云质心在 odom 系，两个坐标系不同。
    # XY 裁剪在 odom 漂移 < 此半径时近似有效；Z 轴不做过滤。
    search_window_radius: 30.0
