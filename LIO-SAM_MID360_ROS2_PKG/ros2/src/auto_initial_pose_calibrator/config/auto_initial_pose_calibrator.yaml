# =============================================================================
# 自动初始位姿校准器配置
# 室内: 旋转360°+粗匹配→topN候选→前进1m→odom约束筛选→唯一Pose→/initialpose
# 室外: RTK(GPS+双天线航向)+校准→/initialpose
# 快速模式: 开机静止采集数帧→全局粒子匹配→直接发布最佳位姿给AMCL
#
# 节点默认使用 namespace=rkbot，话题为相对路径，自动拼接为 /rkbot/<topic>
# =============================================================================
/**:
  ros__parameters:
    # ────── 话题（相对路径，自动拼接 namespace 前缀 /rkbot/）──────
    map_topic: "map"
    scan_topic: "scan"
    odom_topic: "lio/odom"
    amcl_pose_topic: "amcl_pose"
    rtk_topic: "/rtk_pvh"
    rtk_topic_type: "robots_dog_msgs.msg.UniRtkPvh"
    gps_topic: "/fix"
    cmd_vel_topic: "/cmd_vel"
    map_file: ""

    # ────── 坐标系 ──────
    map_frame: "map"

    # ────── 模式 ──────
    outdoor_mode: false
    indoor_mode: true

    # ────── 日志 ──────
    log_dir: "/home/ztl/slam_data/logs"  # 日志持久化目录（为空则不写入文件）
    log_level: "INFO"                    # 文件日志级别: DEBUG/INFO/WARN/ERROR

    # ────── 开机自动启动 ──────
    auto_start: false              # 开机收到地图+scan+odom后自动触发校准
    auto_start_delay: 3.0         # 数据就绪后等待延迟 (秒)
    quick_mode: false             # 快速模式：跳过旋转 (false=保留旋转检查)
    publish_after_rotation: true  # 旋转采集+多步匹配完成后直接发布初始位姿 (跳过运动探索)
    auto_publish_initial_pose: true   # 自动发布 /initialpose (true=发布到话题)

    # ────── 被动持续定位模式 ──────
    passive_mode_enabled: false     # 启用被动持续定位 (服务启动即进入)
    passive_interval: 30.0         # 被动匹配间隔 (秒)
    passive_frame_count: 30        # 每次匹配使用最近N帧 (通过ICP拼接)
    passive_buffer_max: 60        # 循环缓冲区最大帧数
    passive_quality_threshold: 0.25      # [已废弃] 原墙壁覆盖率最低阈值, 现仅记日志不丢弃
    passive_deviation_threshold: 2.0     # 与上次位姿偏差超过此值触发二次验证 (m)
    passive_deviation_yaw_threshold: 30.0 # 与上次位姿偏差超过此值触发二次验证 (deg)

    # ────── 被动模式: 里程计融合轻量验证 ──────
    passive_odom_fusion_enabled: true    # 启用里程计融合验证 (验证通过则跳过扫描匹配)
    passive_odom_max_move: 5.0         # 里程计累计位移上限(m), 超则强制重匹配
    passive_likelihood_threshold: 0.25   # 似然场评分阈值 (likelihood)
    passive_fusion_wall_threshold: 0.20 # 融合验证的墙壁覆盖率阈值
    passive_bootstrap_threshold: 2      # 无历史位姿时连续失败N次后放宽门控至 confidence_threshold_amcl
    passive_amcl_cross_check: true       # 启用 AMCL 位姿交叉验证
    passive_amcl_max_deviation: 1.0     # AMCL 与推算位姿最大允许偏差 (m)
    passive_publish_cooldown: 60.0      # 发布 /initialpose 后冷却时间, 期间放松融合验证 (秒)

    # ────── 置信度门控 ──────
    confidence_threshold_update: 0.50   # 允许更新原点/校准位姿的置信度阈值 (0.0~1.0)
    confidence_threshold_publish: 0.40  # 允许发布 /initialpose 的置信度阈值 (0.0~1.0)
    confidence_threshold_amcl: 0.35     # 低置信度仍可辅助 AMCL 的阈值 (0.0~1.0, 当前仅监控)

    # ────── 旋转采集 ──────
    rotation_min_deg: 180.0
    rotation_scan_interval_deg: 15.0
    rotation_enabled: true          # 是否启用旋转360°全覆盖采集 (quick_mode=true时跳过)
    rotation_total_deg: 360.0       # 旋转总角度（覆盖完整闭环空间）
    rotation_angular_vel: 0.5       # 旋转角速度 (rad/s)

    # ────── 粗匹配 ──────
    rough_match_particles: 5000     # 粗匹配全局粒子数（提高覆盖率）
    rough_match_max_beams: 120      # 匹配用的最大光束数（提高匹配精度）
    rough_top_n: 10

    # ────── 运动/筛选 ──────
    motion_distance: 1.0          # 基准探索距离（增大以提升消歧能力）
    motion_angle_threshold_deg: 10.0
    filter_min_score_ratio: 0.3
    max_active_retry: 5           # 最大探索移动轮数

    # ────── 主动控制与避障 ──────
    max_linear_vel: 0.3          # 最大线速度 (m/s)
    max_angular_vel: 0.5         # 最大角速度 (rad/s)
    kp_linear: 0.8                # 线速度 P 增益
    kp_angular: 1.0               # 角速度 P 增益
    min_safe_distance: 0.5        # 避障紧急停机距离 (m)
    collision_sector_angle_deg: 45.0 # 前进避障监测扇区宽度 (度)

    # ────── 主动探索 (信息增益) ──────
    ig_sample_dist_1: 1.0         # 似然场特征提取的内圈采样半径 (m)
    ig_sample_dist_2: 2.0         # 似然场特征提取的外圈采样半径 (m)

    # ────── 局部子图 ──────
    submap_scan_count: 30         # 构建单次子图所需的雷达帧数（多帧增加密度+时序过滤效果）
    submap_angle_resolution: 0.5  # 子集合成 Scan 的角分辨率 (度)

    # ────── 多帧时序一致性过滤 ──────
    temporal_merge_enabled: true    # 是否启用多帧时序一致性过滤（剔除人/动物/动态障碍物）
    temporal_merge_min_frames: 5    # 至少来自多少不同帧才认定为静态墙壁
    temporal_merge_radius: 0.15     # 判断邻域一致性用的搜索半径 (m)

    # ────── 扫描离群点过滤 ──────
    scan_outlier_filter: true       # 是否启用半径离群点过滤（去除动态障碍物/杂点）
    scan_outlier_radius: 0.3        # 邻域搜索半径 (m)
    scan_outlier_min_neighbors: 3   # 最少邻居点数（低于此数视为离群点）

    # ────── 似然场 ──────
    likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.8
    z_rand: 0.1

    # ────── RTK ──────
    min_soln_svs: 4
    valid_pos_types: [34, 50]
    valid_heading_types: [34, 50]
    publish_rate: 0.5

    use_sim_time: false
    calibration_file: ""

    # ────── ICP 参数 ──────
    icp_max_iterations: 15          # ICP 最大迭代次数
    icp_tolerance_trans: 0.01      # ICP 平移收敛阈值 (m)
    icp_tolerance_rot_deg: 0.1     # ICP 旋转收敛阈值 (度)
    icp_downsample_step: 5          # ICP 降采样步长

    # ────── 运动验证参数 ──────
    motion_verification_enabled: true  # 是否启用运动验证
    motion_verification_threshold: 0.3 # 运动验证距离误差阈值 (m)
    motion_verification_angle_threshold_deg: 15.0  # 运动验证角度误差阈值 (度)

    # ────── 调试对比模式参数 ──────
    debug_comparison_mode: true      # 是否启用调试对比模式

    # ────── 改进匹配参数 (v2) ──────
    grid_search_step: 1.5           # 网格全局搜索步长 (m)
    grid_search_angle_step: 10.0    # 网格全局搜索角度步长 (deg)
    fine_search_radius: 2.5         # 精细局部搜索半径 (m)
    fine_search_pos_step: 0.3       # 精细搜索位置步长 (m)
    fine_search_angle_step: 3.0     # 精细搜索角度步长 (deg)
    min_match_wall_coverage: 0.50   # 最低墙壁覆盖率阈值
    min_match_coverage: 0.15        # 最低有效区域覆盖率

    # ────── 距离场全局匹配 (来自 global_match.py 算法) ──────
    use_distance_field_matching: false    # 启用距离场匹配替代网格搜索 (true=距离场 / false=似然场网格)
    df_angle_step_deg: 5.0               # 距离场匹配角度步长 (度, 越小越精细但越慢)
    df_n_positions: 1000                  # 随机采样的自由空间位置数 (越大覆盖越全但越慢)
    df_scan_max_points: 500              # 匹配用最大扫描点数 (降采样)
    df_multistep_enabled: true            # 多步递推首帧使用距离场搜索
    df_passive_enabled: true              # 被动匹配首帧使用距离场搜索

    # ────── 双模板光线投射全局匹配 (来自 global_match2.py 算法) ──────
    # 核心: 命中模板(奖励) + 射线惩罚模板(惩罚穿墙) + cv2.matchTemplate全图卷积
    # 优点: 速度极快(全图卷积), 天然防穿墙, 角度精修达0.5°
    # 室内/室外参数分离: 系统根据 RTK/GPS 信号自动选择参数组
    use_dual_template_matching: true      # 启用双模板匹配替代网格/距离场 (优先级最高)
    dt_multistep_enabled: true            # 多步递推首帧使用双模板搜索
    dt_passive_enabled: true              # 被动匹配首帧使用双模板搜索

    # ── 室内双模板参数 ──
    dt_indoor:
      angle_step_deg: 3.0               # 粗搜角度步长 (度)
      fine_angle_step_deg: 0.5          # 精修角度步长 (度)
      penalty_weight: 3.0               # 射线穿透惩罚权重
      scan_max_points: 500              # 匹配用最大扫描点数
      min_wall_coverage_ratio: 0.30     # 最低墙覆盖率 (室内墙多, 30%合理)
      free_space_penalty_weight: 0.2    # 自由空间惩罚权重 (防对称走廊误匹配)
      scale_ref_pixels: 300000          # 自适应缩放触发像素数 (室内通常不触发)
      scale_max: 1.5                    # 自适应缩放倍数上限 (室内小地图无需大幅缩放)

    # ── 室外双模板参数 ──
    dt_outdoor:
      angle_step_deg: 3.0               # 粗搜角度步长 (度)
      fine_angle_step_deg: 0.5          # 精修角度步长 (度)
      penalty_weight: 3.0               # 射线穿透惩罚权重
      scan_max_points: 500              # 匹配用最大扫描点数
      min_wall_coverage_ratio: 0.15     # 最低墙覆盖率 (室外空旷墙少, 降低到15%)
      free_space_penalty_weight: 0.2    # 自由空间惩罚权重
      scale_ref_pixels: 500000          # 自适应缩放触发像素数 (提高以延迟触发, 保留精度)
      scale_max: 2.5                    # 自适应缩放倍数上限 (室外场景限制在2.5x, 避免步长过大漏匹配)

    # ────── 偏差监控 ──────
    deviation_monitor_enabled: false  # 是否启用偏差监控 (移动时偏差增大是正常的，关掉无意义日志)
    deviation_check_interval: 2.0    # 偏差检查间隔 (秒)
    deviation_alert_threshold: 0.5   # 偏差告警阈值 (m)
    deviation_alert_window: 180.0    # 开机告警窗口 (秒, 前3分钟严格)

    # ────── 运动状态跟踪 (运动停止触发 & odom→map 偏差检测) ──────
    motion_tracking_enabled: true        # 启用运动状态跟踪
    motion_speed_threshold: 0.05         # 线速度阈值 (m/s)，超过判定为运动
    motion_angular_threshold: 0.05       # 角速度阈值 (rad/s)，超过判定为运动
    motion_settle_time: 1.0              # 停止后等待稳定时间 (秒)
    motion_stop_cooldown: 10.0           # 停止事件触发后冷却时间 (秒)
    passive_odom_deviation_threshold: 0.3   # odom→map 推算偏差触发阈值 (m)，超过触发重匹配
    passive_amcl_deviation_trigger: 1.0     # AMCL 交叉验证阈值 (m)，计算结果与 AMCL 偏差超过此值才更新位姿
